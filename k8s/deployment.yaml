apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-app
  labels:
    app: library
spec:
  replicas: 1          # one copy: book data lives inside the pod, so more copies would disagree
  selector:
    matchLabels:
      app: library
  template:
    metadata:
      labels:
        app: library
    spec:
      containers:
        - name: library
          image: DOCKERHUB_USER/library-system:latest   # Jenkins replaces this with the real tag on every run
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
